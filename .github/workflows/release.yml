name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Linux packaging and smoke-test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm xvfb

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: bash build/generate-icons.sh --macos

      - name: Run Quality Checks
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Build Electron Packages
        if: runner.os != 'Windows'
        run: npm run electron:package -- --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Build universal Windows installer
        if: runner.os == 'Windows'
        env:
          # electron-builder 26.x's default BCJ2 filter can make NSIS silently
          # omit PE files on Windows ARM64. BCJ is compatible with the bundled
          # NSIS runtime decoder and preserves the complete native payload.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
        run: npm run electron:package -- --win --x64 --arm64

      - name: Smoke test packaged Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-test-package.sh linux "${{ matrix.arch }}"

      - name: Smoke test packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-test-package.sh mac "${{ matrix.arch }}"

      - name: Smoke test packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-package.ps1 -Architecture "${{ matrix.arch }}"

      - name: Upload Platform Artifacts
        if: matrix.platform != 'win' || matrix.arch == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: release-binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 2

  publish-release:
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Platform Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-binaries-*
          path: release-dist
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: |
          ls -la release-dist

      - name: Generate SHA-256 checksums
        working-directory: release-dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-dist/*.AppImage
            release-dist/*.deb
            release-dist/*.rpm
            release-dist/*.dmg
            release-dist/*.zip
            release-dist/*.exe
            release-dist/SHA256SUMS.txt
          generate_release_notes: true
