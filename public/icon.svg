<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>
  
  <!-- Play button (triangle) -->
  <path d="M 180 120 L 380 256 L 180 392 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Pen/Annotation tool -->
  <g transform="translate(280, 120)">
    <path d="M 10 180 L 80 110 L 110 140 L 40 210 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="95" cy="95" r="10" fill="#ef4444"/>
    <path d="M 10 180 L 0 220 L 40 210 Z" fill="#cbd5e1"/>
  </g>
  
  <!-- Timeline indicator -->
  <rect x="100" y="420" width="312" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
  <rect x="100" y="420" width="120" height="8" rx="4" fill="#ef4444"/>
</svg>
